<!DOCTYPE html>
<html lang="ko">
<head>

  <title>eigen knot — 심리 검사</title>
  <style>
    /* Global Resets & Base Styles */
    body, html {
      margin: 0; padding: 0; background-color: #f5f5f7; display: flex; justify-content: center; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    #eigen-knot-widget {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", sans-serif !important;
      --ek-bg: #fff;
      --ek-text: #1d1d1f;
      --ek-text-secondary: #86868b;
      --ek-border: #e5e5ea;
      --ek-accent: #1d1d1f;
      --ek-progress-bg: #f0f0f4;
      --ek-scale-active: #000;
      
      background: var(--ek-bg); color: var(--ek-text);
      max-width: 720px; width: 100%; margin: 0 auto;
      padding: 0; box-sizing: border-box; line-height: 1.6;
      position: relative; overflow: hidden;
      box-shadow: 0 4px 40px rgba(0,0,0,0.03);
    }
    
    #eigen-knot-widget *, #eigen-knot-widget *::before, #eigen-knot-widget *::after {
      box-sizing: border-box; margin: 0; padding: 0;
    }

    /* Container */
    .ek-container { min-height: 520px; display: flex; flex-direction: column; }
    .ek-screen { display: none; padding: 40px; flex: 1; opacity: 0; transition: opacity 0.4s ease; }
    .ek-screen.active { display: flex; flex-direction: column; opacity: 1; }

    @media (max-width: 600px) {
      .ek-screen { padding: 30px 20px; display: block; flex: none; height: auto; min-height: 100vh; }
      .ek-container { min-height: 100vh; }
    }

    /* Typography & Buttons */
    .ek-logo {
      font-size: 14px; font-weight: 700; letter-spacing: 1px; margin-bottom: 24px; text-transform: uppercase;
    }
    .ek-title { font-size: 28px; font-weight: 700; line-height: 1.3; margin-bottom: 16px; letter-spacing: -0.5px; }
    .ek-subtitle { font-size: 16px; color: var(--ek-text-secondary); margin-bottom: 40px; }
    
    .ek-btn, .ek-start-btn, .ek-submit-btn {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--ek-accent); color: #fff;
      padding: 16px 32px; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s;
    }
    .ek-btn:active, .ek-start-btn:active, .ek-submit-btn:active { transform: scale(0.98); }
    .ek-btn:disabled, .ek-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .ek-meta { font-size: 13px; color: var(--ek-text-secondary); margin-top: 16px; }

    /* Progress */
    .ek-progress-wrap { padding: 24px 40px; border-bottom: 1px solid var(--ek-border); display: flex; align-items: center; gap: 20px;}
    .ek-progress-bar { flex: 1; height: 6px; background: var(--ek-progress-bg); border-radius: 3px; overflow: hidden; position: relative;}
    .ek-progress-bar::after { content: ''; position: absolute; left: 0; top: 0; height: 100%; background: var(--ek-accent); width: var(--p, 0%); transition: width 0.3s ease; }
    .ek-counter { font-size: 14px; font-weight: 500; color: var(--ek-text-secondary); font-variant-numeric: tabular-nums; }

    /* Question UI */
    .ek-question-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 20px 0; }
    .ek-question-text { font-size: 22px; font-weight: 600; line-height: 1.4; margin-bottom: 40px; text-align: center; word-break: keep-all; }
    
    .ek-scale { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 480px; margin: 0 auto; }
    .ek-scale-option {
      flex: 1; display: flex; align-items: center; padding: 16px 20px;
      border: 1px solid var(--ek-border); border-radius: 12px; cursor: pointer;
      transition: background 0.2s, border-color 0.2s; background: var(--ek-bg);
    }
    .ek-scale-option.selected { border-color: var(--ek-scale-active); background: rgba(0,0,0,0.03); }
    .ek-scale-option.selected .ek-scale-radio { border-color: var(--ek-scale-active); background: var(--ek-scale-active); }
    .ek-scale-radio {
      width: 20px; height: 20px; border-radius: 50%; border: 2px solid #c7c7cc; margin-right: 16px; flex-shrink: 0;
    }
    .ek-scale-label { font-size: 16px; font-weight: 500; color: var(--ek-text); }

    /* Navigation */
    .ek-nav { display: flex; justify-content: space-between; margin-top: 40px; }
    .ek-nav-btn { background: transparent; color: var(--ek-text-secondary); border: none; font-size: 15px; font-weight: 500; cursor: pointer; padding: 10px 0; }
    .ek-nav-next { color: var(--ek-accent); font-weight: 600; }
    .ek-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Loading */
    .ek-loading-wrap { text-align: center; margin: auto; }
    .ek-spinner {
      width: 40px; height: 40px; border: 3px solid var(--ek-progress-bg); border-top-color: var(--ek-accent);
      border-radius: 50%; animation: ekSpin 1s linear infinite; margin: 0 auto 20px;
    }
    @keyframes ekSpin { to { transform: rotate(360deg); } }

    /* Persona Result UI */
    .ek-result-title {
      font-size: 24px; font-weight: 700; margin-bottom: 30px; text-align: center;
      border-bottom: 2px solid #1d1d1f; padding-bottom: 15px;
    }
    .ek-persona-box {
      background: #fafafa; border: 1px solid var(--ek-border); border-radius: 12px; padding: 30px; margin-bottom: 24px;
    }
    .ek-persona-name { font-size: 22px; font-weight: 700; color: #1d1d1f; margin-bottom: 8px; }
    .ek-persona-hero { font-size: 14px; font-weight: 600; color: var(--ek-text-secondary); margin-bottom: 20px; }
    .ek-persona-label { font-size: 13px; font-weight: 700; color: var(--ek-text-secondary); text-transform: uppercase; margin-bottom: 6px; }
    .ek-persona-text { font-size: 15px; line-height: 1.6; color: #333; margin-bottom: 20px;}
    .ek-persona-text:last-child { margin-bottom: 0; }
    .ek-subtext { text-align: center; font-size: 13px; color: var(--ek-text-secondary); margin-top: 40px; }
  </style>
</head>

    function renderQuestion(animate) {
      const q = questions[currentIndex];
      progressBar.style.setProperty('--p', ((currentIndex + 1) / 50 * 100) + '%');
      counter.textContent = (currentIndex + 1) + ' / 50';
      prevBtn.disabled = currentIndex === 0;

      const isLast = currentIndex === 49;
      nextBtn.style.display = isLast ? 'none' : '';

      nextBtn.disabled = !(q.id in answers); submitBtn.disabled = !(q.id in answers);

        const wrap = document.querySelector('.ek-question-wrap');
        wrap.style.transition = 'opacity 0.15s ease, transform 0.15s ease';
        wrap.style.opacity = '0'; wrap.style.transform = 'translateY(4px)';
        setTimeout(() => {
          setQuestionContent(q);
          wrap.style.opacity = '1'; wrap.style.transform = 'translateY(0)';
          isTransitioning = false;
        }, 150);
      } else {
        setQuestionContent(q); isTransitioning = false;
      }
    }

    function setQuestionContent(q) {
      questionText.textContent = q.text;
      scaleContainer.innerHTML = '';
      scaleOptions.forEach(opt => {
        const div = document.createElement('div');
        div.className = 'ek-scale-option' + (answers[q.id] === opt.value ? ' selected' : '');
        div.innerHTML = `<div class="ek-scale-radio"></div><span class="ek-scale-label">${opt.label}</span>`;
        div.addEventListener('click', () => {
          if (isTransitioning) return;
          answers[q.id] = opt.value;
          renderQuestion(false);
          isTransitioning = true;

          }, 150);

        scaleContainer.appendChild(div);

      const pData = PERSONA_DATA[typeKey];
      
      resultContent.innerHTML = `
        <div class="ek-persona-box">
          <div class="ek-persona-name">${pData.name}</div>
          <div class="ek-persona-hero">${pData.hero}</div>
          <div class="ek-persona-label">핵심 진단</div>
          <div class="ek-persona-text">${pData.desc}</div>
        </div>
      `;
    }

    submitBtn.addEventListener('click', handleSubmit);

  })();
  </script>
</body>
