      { id: 48, text: '나는 상상력이 풍부하다고 생각한다.' },
      { id: 49, text: '주변 사람들이 힘들어할 때 정서적으로 함께해 주는 편이다.' },
      { id: 50, text: '다른 사람의 어려움을 보면 자연스럽게 돕고 싶어진다.' },
    ];

    const scaleOptions = [
      { value: 1, label: '전혀 그렇지 않다' },
      { value: 2, label: '그렇지 않다' },
      { value: 3, label: '보통이다' },
      { value: 4, label: '그렇다' },
      { value: 5, label: '매우 그렇다' }
    ];

    // ── State ──
    let currentIndex = 0;
    const answers = {};

    // ── DOM Elements ──
    const containerEl    = document.getElementById('ek-container');
    const startScreen    = document.getElementById('ek-start-screen');
    const questionScreen = document.getElementById('ek-question-screen');
    const loadingScreen  = document.getElementById('ek-loading-screen');
    const resultScreen   = document.getElementById('ek-result-screen');
    const progressWrap   = document.getElementById('ek-progress-wrap');
    const progressBar    = document.getElementById('ek-progress-bar');
    const counter        = document.getElementById('ek-counter');
    const questionText   = document.getElementById('ek-question-text');
    const scaleContainer = document.getElementById('ek-scale');
    const prevBtn        = document.getElementById('ek-prev-btn');
    const nextBtn        = document.getElementById('ek-next-btn');
    const submitBtn      = document.getElementById('ek-submit-btn');
    const startBtn       = document.getElementById('ek-start-btn');
    const chartsEl       = document.getElementById('ek-charts');
    const errorToast     = document.getElementById('ek-error');

    // ── Screen Transition ──
    function showScreen(target) {
      const screens = [startScreen, questionScreen, loadingScreen, resultScreen];
      screens.forEach(s => s.classList.remove('active'));

      if (target === resultScreen) {
        containerEl.classList.add('ek-container--result');
      } else {
        containerEl.classList.remove('ek-container--result');
      }

      setTimeout(() => {
        target.classList.add('active');
        if (target === resultScreen) {
          const widget = document.getElementById('eigen-knot-widget');
          if (widget) widget.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, 60);
    }

    // ── Error Display ──
    function showError(message) {
      if (errorToast) {
        errorToast.textContent = message;
        errorToast.style.display = 'block';
        setTimeout(() => { if(errorToast) errorToast.style.display = 'none'; }, 4000);
      } else {
        alert(message); // Fallback if Ghost stripped the toast div
      }
    }

    // ── Render Question ──
    function renderQuestion(animate) {
      const q = questions[currentIndex];
      const total = questions.length;

      progressBar.style.width = ((currentIndex + 1) / total * 100) + '%';
      counter.textContent = (currentIndex + 1) + ' / ' + total;

      prevBtn.disabled = currentIndex === 0;

      const isLast = currentIndex === total - 1;
      nextBtn.style.display = isLast ? 'none' : '';
      submitBtn.style.display = isLast ? '' : 'none';

      nextBtn.disabled = !(q.id in answers);
      submitBtn.disabled = !(q.id in answers);

      if (animate) {
        const wrap = document.querySelector('.ek-question-wrap');
        wrap.style.opacity = '0';
        wrap.style.transform = 'translateY(8px)';
        setTimeout(() => {
          setQuestionContent(q);
          wrap.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
          wrap.style.opacity = '1';
          wrap.style.transform = 'translateY(0)';
        }, 200);
      } else {
        setQuestionContent(q);
      }
    }

    function setQuestionContent(q) {
      questionText.textContent = q.text;
      scaleContainer.innerHTML = '';
      scaleOptions.forEach(opt => {
        const div = document.createElement('div');
        div.className = 'ek-scale-option' + (answers[q.id] === opt.value ? ' selected' : '');
        div.innerHTML =
          '<div class="ek-scale-radio"></div>' +
          '<span class="ek-scale-label">' + opt.label + '</span>';
        div.addEventListener('click', () => selectOption(q.id, opt.value));
        scaleContainer.appendChild(div);
      });
    }

    function selectOption(qId, value) {
      answers[qId] = value;
      const options = scaleContainer.querySelectorAll('.ek-scale-option');
      options.forEach((el, i) => {
        el.classList.toggle('selected', scaleOptions[i].value === value);
      });
      nextBtn.disabled = false;
      submitBtn.disabled = false;

      if (currentIndex < questions.length - 1) {
        setTimeout(() => goNext(), 350);
      }
    }

    function goNext() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion(true);
      }
    }

    function goPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion(true);
      }
    }

    // ═══════════════════════════════════════════════════
    // RESULT — Comparison Bar Charts
    // ═══════════════════════════════════════════════════

    function renderResults(scores) {
      chartsEl.innerHTML = '';

      const { factors, subfactors, comparisons } = scores;

      // Merge all scores into a single lookup for easy access
      const allScores = {};
      Object.entries(factors).forEach(([k, v]) => { allScores[k] = v.score100; });
      Object.entries(subfactors).forEach(([k, v]) => { allScores[k] = v.score100; });

      // Render each comparison pair as a bar chart group
      const compEntries = Object.values(comparisons);

      compEntries.forEach((comp, idx) => {
        const leftLabel  = SCORE_LABELS[comp.left]  || comp.left;
        const rightLabel = SCORE_LABELS[comp.right] || comp.right;
        const leftScore  = allScores[comp.left]  || 0;
        const rightScore = allScores[comp.right] || 0;
        const colors     = COMP_COLORS[idx % COMP_COLORS.length];

        const group = document.createElement('div');
        group.className = 'ek-comp-group';

        // Title
        const title = document.createElement('div');
        title.className = 'ek-comp-title';
        title.textContent = leftLabel + '  vs  ' + rightLabel;
        group.appendChild(title);

        // Chart area: left bar | VS | right bar
        const chart = document.createElement('div');
        chart.className = 'ek-comp-chart';

        // Left bar
        const leftCol = document.createElement('div');
        leftCol.className = 'ek-comp-bar-col';
        leftCol.innerHTML =
          '<span class="ek-comp-bar-score" style="color:' + colors[0] + '">' + leftScore.toFixed(0) + '</span>' +
          '<div class="ek-comp-bar-track">' +
            '<div class="ek-comp-bar-fill" style="background:' + colors[0] + ';" data-height="' + leftScore + '"></div>' +
          '</div>' +
          '<span class="ek-comp-bar-name">' + leftLabel + '</span>';
        chart.appendChild(leftCol);

        // VS divider
        const vs = document.createElement('div');
        vs.className = 'ek-comp-vs-divider';
        vs.textContent = 'VS';
        chart.appendChild(vs);

        // Right bar
        const rightCol = document.createElement('div');
        rightCol.className = 'ek-comp-bar-col';
        rightCol.innerHTML =
          '<span class="ek-comp-bar-score" style="color:' + colors[1] + '">' + rightScore.toFixed(0) + '</span>' +
          '<div class="ek-comp-bar-track">' +
            '<div class="ek-comp-bar-fill" style="background:' + colors[1] + ';" data-height="' + rightScore + '"></div>' +
          '</div>' +
          '<span class="ek-comp-bar-name">' + rightLabel + '</span>';
        chart.appendChild(rightCol);

        group.appendChild(chart);

        // Insight text
        const insight = document.createElement('div');
        insight.className = 'ek-comp-insight';
        const diff = comp.diff;
        const absDiff = (Math.abs(diff) / 4 * 100).toFixed(0); // Convert raw diff to score100 scale
        if (diff > 0) {
          insight.innerHTML = '<strong>' + leftLabel + '</strong>이(가) ' + Math.abs(leftScore - rightScore).toFixed(0) + '점 더 높습니다';
        } else if (diff < 0) {
          insight.innerHTML = '<strong>' + rightLabel + '</strong>이(가) ' + Math.abs(leftScore - rightScore).toFixed(0) + '점 더 높습니다';
        } else {
          insight.innerHTML = '두 차원이 <strong>균형</strong>을 이루고 있습니다';
        }
        group.appendChild(insight);

        chartsEl.appendChild(group);

        // Animate bars with staggered delay
        setTimeout(() => {
          [leftCol, rightCol].forEach((col, bIdx) => {
            setTimeout(() => {
              col.classList.add('animated');
              const fill = col.querySelector('.ek-comp-bar-fill');
              fill.style.height = fill.dataset.height + '%';
            }, bIdx * 200);
          });
        }, 300 + idx * 250);
      });
    }

    // ═══════════════════════════════════════════════════
    // SUBMIT → FETCH SCORES → RENDER
    // ═══════════════════════════════════════════════════

    async function handleSubmit() {
      showScreen(loadingScreen);
      progressWrap.style.display = 'none';

      // 강제 인라인 디버거
      const debugBox = document.createElement('div');
      debugBox.style = "margin-top:20px; padding:15px; background:black; color:lime; font-family:monospace; font-size:12px; text-align:left;";
      loadingScreen.appendChild(debugBox);
      function log(m) { debugBox.innerHTML += '<div>' + m + '</div>'; }

      try {
        log("1. 제출 함수 진입 완료");

        const answerArray = [];
        const missing = [];
        for (let i = 1; i <= 50; i++) {
          if (answers[i] === undefined || answers[i] === null) {
            missing.push(i);
          }
          answerArray.push(answers[i] || null);
        }

        if (missing.length > 0) {
          log("에러: 미응답 문항 발견 - " + missing.join(','));
          showError('응답하지 않은 문항이 있습니다. (문항 ' + missing.join(', ') + ')');
          currentIndex = missing[0] - 1;
          showScreen(questionScreen);
          progressWrap.style.display = '';
          renderQuestion(false);
          return;
        }

        log("2. 응답 배열 구성 완료 (50개)");
        log("3. API 호출 시도: " + API_BASE_URL);

        // 1. Submit answers
        const submitRes = await fetch(API_BASE_URL + '/api/v1/assessments/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers: answerArray }),
        });

        log("4. fetch 응답 수신 완료. Status: " + submitRes.status);

        if (!submitRes.ok) {
          const errBody = await submitRes.text();
          throw new Error('서버 오류 (' + submitRes.status + ') ' + errBody);
        }

        const submitData = await submitRes.json();
        const assessmentId = submitData.assessment_id;
        log("5. Assessment ID 획득: " + assessmentId);
        log("6. 결과 점수 조회 시도중...");

        // 2. Fetch full scores
        const scoresRes = await fetch(API_BASE_URL + '/api/v1/assessments/' + assessmentId);

        log("7. 점수 데이터 수신 완료. Status: " + scoresRes.status);

        if (!scoresRes.ok) {
          throw new Error('결과 조회 실패 (' + scoresRes.status + ')');
        }

        const scoresData = await scoresRes.json();
        log("8. 결과 화면 렌더링 호출");

        // 3. Render results
        renderResults(scoresData.scores);

        // 4. Show result screen
        setTimeout(() => {
          log("9. 결과 화면 전환 타이머 동작");
          showScreen(resultScreen);
          document.body.removeChild(dbg);
        }, 1200);

      } catch (error) {
        log("💥 크래시 발생: " + error.message);
        log("에러 상세: " + error.stack);
        
        // 원시적인 에러 노출
        const errDiv = document.createElement('div');
        errDiv.style = "background:red;color:white;padding:10px;text-align:center;font-weight:bold;margin-bottom:20px;";
        errDiv.textContent = '제출 에러: ' + error.message;
        errorToast ? errorToast.appendChild(errDiv) : document.body.prepend(errDiv);

        showScreen(questionScreen);
        progressWrap.style.display = '';
        currentIndex = questions.length - 1;
        renderQuestion(false);
      }
    }

    // ── Event Listeners ──
    startBtn.addEventListener('click', () => {
      showScreen(questionScreen);
      progressWrap.style.display = '';
      renderQuestion(false);
    });

    nextBtn.addEventListener('click', goNext);
    prevBtn.addEventListener('click', goPrev);
    submitBtn.addEventListener('click', handleSubmit);

    document.addEventListener('keydown', (e) => {
      if (!questionScreen.classList.contains('active')) return;
      if (e.key === 'ArrowRight' || e.key === 'Enter') {
        if (currentIndex < questions.length - 1 && !nextBtn.disabled) goNext();
      }
      if (e.key === 'ArrowLeft') goPrev();
      const num = parseInt(e.key);
      if (num >= 1 && num <= 5) {
        selectOption(questions[currentIndex].id, num);
      }
    });

  })();
  </script>
</div>
