# eigen knot — Render Deployment Configuration
# See: https://render.com/docs/deploy-with-render-yaml

services:
  - type: web
    name: eigenknot-api
    runtime: python
    region: singapore  # closest to Korea
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEBUG
        value: false
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.11"
    healthCheckPath: /health
